name: draft-video
run-name: "draft ${{ inputs.request_id || github.run_id }}"

# Makes one video and saves it to the library (a GitHub Release named video-<id>), then optionally posts it.
# Claude finds a trend (or uses your topic), researches it, writes and directs it, reviews the frames; the free
# engine renders it; Claude writes the captions and hashtags. Started from the web UI or the Actions tab.
# Secrets: ANTHROPIC_API_KEY (required); YOUTUBE_CLIENT_ID, YOUTUBE_CLIENT_SECRET, YOUTUBE_REFRESH_TOKEN,
# IG_ACCESS_TOKEN, IG_USER_ID (optional, for posting). Variable RUNNER picks the machine (default ubuntu-latest).
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID for this video (the web UI sets it; leave blank when running by hand)"
        default: ""
      options:
        description: 'JSON options, e.g. {"language":"en","niche":"space","topic":"","format":"auto","publish":{"youtube":false}}'
        default: '{"language":"en","niche":"space"}'
  # schedule:
  #   - cron: "0 4 * * *"   # 09:30 IST daily, trending topic with the default options

permissions:
  contents: write

concurrency:
  group: draft-video        # one video at a time; extra requests wait in the queue
  cancel-in-progress: false

env:
  RID: ${{ inputs.request_id || github.run_id }}
  OPTIONS: ${{ inputs.options || '{"language":"en","niche":"space"}' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}

jobs:
  draft:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Install tools
        run: |
          [[ "$RID" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "request_id must be letters, digits, - or _"; exit 1; }
          echo "$OPTIONS" | python -c "import json,sys; json.load(sys.stdin)" || { echo "options is not valid JSON"; exit 1; }
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libgl1 libegl1 fonts-noto-color-emoji
          pip install -q -r requirements.txt
          python run.py setup
          echo "OUT=data/out/$RID" >> "$GITHUB_ENV"
          mkdir -p "data/out/$RID" && echo "$OPTIONS" > "data/out/$RID/options.json"
      - name: Find trend
        run: python run.py e2e --stage scout --out "$OUT" --options "$OPTIONS"
      - name: Research
        run: python run.py e2e --stage research --out "$OUT" --options "$OPTIONS"
      - name: Write and direct
        run: python run.py e2e --stage write --out "$OUT" --options "$OPTIONS"
      - name: Review frames
        run: python run.py e2e --stage qa --out "$OUT" --options "$OPTIONS"
      - name: Render video
        run: python run.py e2e --stage render --out "$OUT" --options "$OPTIONS"
      - name: Write captions and hashtags
        run: python run.py e2e --stage package --out "$OUT" --options "$OPTIONS"
      - name: Save to library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/library.py notes "$OUT" > "$RUNNER_TEMP/notes.md"
          TITLE=$(python -c "import json; print(json.load(open('$OUT/summary.json'))['title'][:120])")
          FILES=""
          for f in final.mp4 thumbnail.jpg summary.json meta.json spec.json facts.json qa.json idea.json options.json; do
            [ -f "$OUT/$f" ] && FILES="$FILES $OUT/$f"
          done
          gh release create "video-$RID" $FILES --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
      - name: Post to YouTube and Instagram
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python run.py e2e --stage publish --out "$OUT" --options "$OPTIONS" || STATUS=$?
          if [ -f "$OUT/published.json" ]; then
            python tools/library.py notes "$OUT" > "$RUNNER_TEMP/notes.md"
            gh release edit "video-$RID" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "video-$RID" "$OUT/published.json" --clobber
          fi
          exit ${STATUS:-0}
      - name: Keep a copy for debugging
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ env.RID }}
          path: |
            data/out/${{ env.RID }}/*.json
            data/out/${{ env.RID }}/*.jpg
            data/out/${{ env.RID }}/final.mp4
          if-no-files-found: ignore
