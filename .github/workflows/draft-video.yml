name: draft-video
run-name: "draft ${{ inputs.request_id || (github.event_name == 'schedule' && 'autopilot' || github.run_id) }}"

# Makes one video and saves it to the library (a GitHub Release named video-<id>), then optionally posts it.
# Claude finds a trend (or uses your topic), researches it, writes and directs it, reviews the frames; the free
# engine renders it; Claude writes the captions and hashtags. Started from the web UI, the Actions tab, or every
# hour by autopilot (the Supabase `autopilot` row decides whether a video is due).
# Secrets: SUPABASE_URL and SUPABASE_SERVICE_KEY (keys then come from the Supabase settings table). The old
# per-key secrets (ANTHROPIC_API_KEY, YOUTUBE_*, IG_*) still work as a fallback. Variable RUNNER picks the machine.
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "ID for this video (the web UI sets it to the job id; leave blank when running by hand)"
        default: ""
      options:
        description: 'JSON options, e.g. {"language":"en","niche":"space","topic":"","format":"auto","publish":{"youtube":false}}'
        default: '{"language":"en","niche":"space"}'
  schedule:
    - cron: "30 */1 * * *"   # hourly; tools/autopilot.py decides (IST slots, daily quota, topic queue)

permissions:
  contents: write

concurrency:
  # one group per video: several videos can render side by side (GitHub only keeps ONE pending run per group and
  # cancels the rest, so a shared group would silently drop videos when more than two are requested at once)
  group: draft-video-${{ inputs.request_id || github.run_id }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

jobs:
  draft:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Decide
        id: decide
        env:
          INPUT_RID: ${{ inputs.request_id }}
          INPUT_OPTIONS: ${{ inputs.options }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            python tools/autopilot.py
          else
            python - <<'PY'
          import json, os
          rid = os.environ.get("INPUT_RID") or os.environ["GITHUB_RUN_ID"]
          o = json.loads(os.environ.get("INPUT_OPTIONS") or '{"language":"en","niche":"space"}')
          o.setdefault("source", "manual")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"skip=false\nrequest_id={rid}\njob_id={o.get('job_id') or ''}\n")
              f.write("options=" + json.dumps(o, ensure_ascii=False, separators=(",", ":")) + "\n")
          print(rid, o)
          PY
          fi
      - name: Prepare
        if: steps.decide.outputs.skip != 'true'
        env:
          RID: ${{ steps.decide.outputs.request_id }}
          JOB_ID: ${{ steps.decide.outputs.job_id }}
          OPTIONS: ${{ steps.decide.outputs.options }}
        run: |
          [[ "$RID" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "request_id must be letters, digits, - or _"; exit 1; }
          echo "$OPTIONS" | python -c "import json,sys; json.load(sys.stdin)" || { echo "options is not valid JSON"; exit 1; }
          {
            echo "RID=$RID"
            echo "JOB_ID=$JOB_ID"
            echo "OUT=data/out/$RID"
            echo "OPTIONS<<VF_EOF"; echo "$OPTIONS"; echo "VF_EOF"
          } >> "$GITHUB_ENV"
          mkdir -p "data/out/$RID" && echo "$OPTIONS" > "data/out/$RID/options.json"
      - name: Cache voice model
        if: steps.decide.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Cache footage clips
        if: steps.decide.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: models/footage
          key: footage-${{ github.run_id }}
          restore-keys: footage-
      - name: Install tools
        if: steps.decide.outputs.skip != 'true'
        run: |
          echo "STEP=Install tools" >> "$GITHUB_ENV"
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libgl1 libegl1 fonts-noto-color-emoji
          pip install -q -r requirements.txt
          python run.py setup
          # 3D build videos render in headless Chrome (preinstalled on GitHub runners); fetch Chromium only if missing
          google-chrome --version || python -m playwright install --with-deps chromium
      - name: Find trend
        if: steps.decide.outputs.skip != 'true'
        run: echo "STEP=Find trend" >> "$GITHUB_ENV" && python run.py e2e --stage scout --out "$OUT" --options "$OPTIONS"
      - name: Research
        if: steps.decide.outputs.skip != 'true'
        run: echo "STEP=Research" >> "$GITHUB_ENV" && python run.py e2e --stage research --out "$OUT" --options "$OPTIONS"
      - name: Write and direct
        if: steps.decide.outputs.skip != 'true'
        run: echo "STEP=Write and direct" >> "$GITHUB_ENV" && python run.py e2e --stage write --out "$OUT" --options "$OPTIONS"
      - name: Review frames
        if: steps.decide.outputs.skip != 'true'
        run: echo "STEP=Review frames" >> "$GITHUB_ENV" && python run.py e2e --stage qa --out "$OUT" --options "$OPTIONS"
      - name: Render video
        if: steps.decide.outputs.skip != 'true'
        run: echo "STEP=Render video" >> "$GITHUB_ENV" && python run.py e2e --stage render --out "$OUT" --options "$OPTIONS"
      - name: Write captions and hashtags
        if: steps.decide.outputs.skip != 'true'
        run: echo "STEP=Write captions and hashtags" >> "$GITHUB_ENV" && python run.py e2e --stage package --out "$OUT" --options "$OPTIONS"
      - name: Save to library
        if: steps.decide.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "STEP=Save to library" >> "$GITHUB_ENV"
          python tools/library.py notes "$OUT" > "$RUNNER_TEMP/notes.md"
          TITLE=$(python -c "import json; print(json.load(open('$OUT/summary.json'))['title'][:120])")
          FILES=""
          for f in final.mp4 thumbnail.jpg summary.json meta.json spec.json facts.json qa.json idea.json options.json; do
            [ -f "$OUT/$f" ] && FILES="$FILES $OUT/$f"
          done
          gh release create "video-$RID" $FILES --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
      - name: Post to YouTube and Instagram
        if: steps.decide.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "STEP=Post to YouTube and Instagram" >> "$GITHUB_ENV"
          python run.py e2e --stage publish --out "$OUT" --options "$OPTIONS" || STATUS=$?
          if [ -f "$OUT/published.json" ]; then
            python tools/library.py notes "$OUT" > "$RUNNER_TEMP/notes.md"
            gh release edit "video-$RID" --notes-file "$RUNNER_TEMP/notes.md"
            gh release upload "video-$RID" "$OUT/published.json" --clobber
          fi
          exit ${STATUS:-0}
      - name: Mark job done
        if: steps.decide.outputs.skip != 'true'
        run: python tools/store.py done "$RID" "$JOB_ID"
      - name: Mark as failed
        if: failure() && steps.decide.outputs.skip != 'true'
        run: |
          python tools/store.py fail "$RID" "$JOB_ID" "failed at ${STEP:-Prepare} ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
      - name: Keep a copy for debugging
        if: failure() && steps.decide.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ env.RID }}
          path: |
            data/out/${{ env.RID }}/*.json
            data/out/${{ env.RID }}/*.jpg
            data/out/${{ env.RID }}/final.mp4
          if-no-files-found: ignore
