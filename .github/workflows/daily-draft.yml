name: draft-video

# Runs the full Claude flow on GitHub's runners and attaches the rendered video as an artifact.
# Requires the repo secret ANTHROPIC_API_KEY. Spends Claude credits each run, so it's manual by default.
on:
  workflow_dispatch:
    inputs:
      language:
        description: "en | hi | hinglish"
        default: "en"
      topic:
        description: "optional topic (blank = scout real trends)"
        default: ""
  # schedule:
  #   - cron: "0 4 * * *"   # 09:30 IST daily

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libegl1 fonts-noto-color-emoji
      - run: pip install -r requirements.txt
      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - run: python run.py setup
      - name: Make the video
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LANGUAGE: ${{ github.event.inputs.language || 'en' }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: python run.py e2e --language "$LANGUAGE" --topic "$TOPIC"
      - uses: actions/upload-artifact@v4
        with:
          name: draft-video
          path: |
            data/out/e2e_*/final.mp4
            data/out/e2e_*/*.json
            data/out/e2e_*/thumbnail.jpg
