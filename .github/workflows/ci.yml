name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libegl1 fonts-noto-color-emoji
      - name: Python packages
        run: pip install -r requirements.txt pytest
      - name: Fonts (voice model skipped; tests fall back to silence)
        run: python run.py setup --fonts-only
      - name: Validate example specs
        run: for f in examples/*.json; do python run.py validate "$f"; done
      - name: Offline tests
        run: python -m pytest -q tests
